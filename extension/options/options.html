<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="settings"></title>
    <link rel="stylesheet" href="../popup/popup.css" />
    <style>
      body {
        width: auto;
        max-width: 560px;
        margin: 32px auto;
        padding: 0 16px;
        gap: 20px;
      }
      h1 {
        font-size: 20px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row .btn {
        padding: 0 14px;
      }
      label.toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      #status {
        min-height: 20px;
        color: var(--accent);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../icons/icon48.png" width="32" height="32" alt="" />
      <h1 data-i18n="extShortName"></h1>
      <span id="plan" class="badge"></span>
    </header>

    <div class="card">
      <h2 data-i18n="syncTitle"></h2>
      <p class="muted" data-i18n="syncText"></p>
      <label class="toggle"><input type="checkbox" id="sync" /> <span data-i18n="syncToggle"></span></label>
      <button id="upgrade" class="link" data-i18n="upgradeButton" hidden></button>
    </div>

    <div class="card">
      <h2 data-i18n="backupTitle"></h2>
      <p class="muted" data-i18n="backupText"></p>
      <div class="row">
        <button id="export" class="btn" data-i18n="exportJson"></button>
        <button id="import" class="btn" data-i18n="importJson"></button>
        <input type="file" id="file" accept="application/json,.json" hidden />
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="privacyTitle"></h2>
      <p class="muted" data-i18n="privacyText"></p>
    </div>

    <div id="status" role="status"></div>

    <script src="../background/config.js"></script>
    <script src="../content/storage.js"></script>
    <script src="options.js"></script>
  </body>
</html>
