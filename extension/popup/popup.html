<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" width="24" height="24" alt="" />
      <h1 data-i18n="extShortName"></h1>
      <span id="plan" class="badge"></span>
    </header>

    <p id="stats" class="muted"></p>

    <button id="open" class="btn primary" data-i18n="openClaude"></button>

    <section id="free-box" hidden>
      <p class="muted" id="limit-text"></p>
      <button id="upgrade" class="btn" data-i18n="upgradeButton"></button>
      <button id="login" class="link" data-i18n="restorePurchase"></button>
    </section>

    <section id="pro-box" hidden>
      <button id="manage" class="btn" data-i18n="manageSubscription"></button>
    </section>

    <footer>
      <button id="options" class="link" data-i18n="settings"></button>
    </footer>

    <script src="../content/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
